name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}

  client:
    name: Client minimum Go version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache: false
      - run: go test ./...
        working-directory: client
        env:
          GOTOOLCHAIN: local

  nix:
    name: Nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: so1ve
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Check Nix formatting and workflows
        if: matrix.system == 'x86_64-linux'
        run: |
          nix fmt
          git diff --exit-code
          nix run --inputs-from . nixpkgs#actionlint -- -color
          nix flake check --all-systems --no-build
      - run: nix build ".#packages.${{ matrix.system }}.default" --print-build-logs
