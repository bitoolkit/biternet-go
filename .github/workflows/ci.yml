name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  format:
    name: Go formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          go install mvdan.cc/gofumpt@v0.12.0
          gofumpt -w .
          git diff --exit-code

  test:
    name: Go checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libayatana-appindicator3-1 libgl1 fontconfig
      - name: Check and test
        run: |
          python -m pip install -r scripts/requirements.txt
          go generate ./internal/desktop
          go vet ./...
          go test ./...
          (cd client && go vet ./... && go test ./...)
      - name: Check races
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          go test -race ./...
          (cd client && go test -race ./...)

  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}

  client:
    name: Client minimum Go version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: client/go.mod
          cache: false
      - run: go test ./...
        working-directory: client
        env:
          GOTOOLCHAIN: local

  nix:
    name: Nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31.11.3
      - uses: cachix/cachix-action@v17
        with:
          name: so1ve
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Check Nix formatting and workflows
        if: matrix.system == 'x86_64-linux'
        run: |
          nix fmt
          git diff --exit-code
          nix run --inputs-from . nixpkgs#actionlint -- -color
          nix flake check --all-systems --no-build
      - run: nix build ".#packages.${{ matrix.system }}.default" --print-build-logs
